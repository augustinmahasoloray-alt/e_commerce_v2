<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — StepUp Admin</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        backgroundColor: "var(--color-background)",
                        surfaceColor: "var(--color-surface)",
                        textColor: "var(--color-text)",
                        accent: "var(--color-accent)",
                        muted: "var(--color-muted)",
                    },
                    fontFamily: {
                        display: ["Qurova", "serif"],
                        headline: ["Metal", "sans-serif"],
                        body: ["Albert Sans", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="/admin/css/style.css" />
    <script src="/admin/js/theme.js"></script>
</head>
<body class="font-body bg-backgroundColor text-textColor min-h-screen flex items-center justify-center px-4">

    <button
        onclick="toggleTheme()"
        aria-label="Changer de thème"
        class="fixed top-6 right-6 w-10 h-10 rounded-full bg-surfaceColor flex items-center justify-center hover:opacity-80 transition-opacity"
    >
        🌓
    </button>

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="font-headline text-2xl">
                StepUp<span class="text-accent">.admin</span>
            </h1>
            <p class="text-muted text-sm mt-2">Connexion réservée à l'administrateur</p>
        </div>

        <form id="loginForm" class="bg-surfaceColor rounded-lg shadow-lg p-8 space-y-5">
            <div>
                <label for="email" class="block text-sm font-medium mb-2">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    class="w-full px-4 py-3 rounded-md bg-backgroundColor border border-muted/30 focus:ring-2 focus:ring-accent focus:border-transparent outline-none text-sm"
                    placeholder="admin@stepup.shop"
                />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium mb-2">Mot de passe</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-3 rounded-md bg-backgroundColor border border-muted/30 focus:ring-2 focus:ring-accent focus:border-transparent outline-none text-sm"
                    placeholder="••••••••"
                />
            </div>

            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-accent text-backgroundColor font-medium py-3 rounded-md hover:opacity-90 transition-opacity disabled:opacity-50"
            >
                Se connecter
            </button>

            <p id="errorMsg" class="text-sm text-red-500 text-center hidden"></p>
        </form>

        <p class="text-center text-sm text-muted mt-6">
            Pas encore de compte admin ?
            <a href="/admin/create-account.html" class="text-accent hover:underline">Créer un compte</a>
        </p>
    </div>

    <script src="/admin/js/api.js"></script>
    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const errorMsg = document.getElementById("errorMsg");
            const submitBtn = document.getElementById("submitBtn");
            errorMsg.classList.add("hidden");
            submitBtn.disabled = true;
            submitBtn.textContent = "Connexion en cours...";

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("" + window.location.origin + "/api/admin/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password }),
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Échec de la connexion.");
                }

                localStorage.setItem("admin_token", result.token);
                localStorage.setItem("admin_user", JSON.stringify(result.user));
                window.location.href = "/admin/dashboard.html";
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.classList.remove("hidden");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Se connecter";
            }
        });
    </script>
</body>
</html>
